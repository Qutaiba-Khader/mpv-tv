name: Sync Upstream
on:
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday 6am UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Add upstream remote
        run: git remote add upstream https://github.com/mpv-android/mpv-android.git

      - name: Fetch upstream
        run: git fetch upstream master

      - name: Check for new commits
        id: check
        run: |
          BEHIND=$(git rev-list --count master..upstream/master)
          echo "behind=$BEHIND" >> $GITHUB_OUTPUT
          echo "Upstream has $BEHIND new commits"

      - name: Create sync branch
        if: steps.check.outputs.behind != '0'
        run: |
          git checkout -b sync-upstream-$(date +%Y%m%d)
          git merge upstream/master --no-edit || true

      - name: Create PR
        if: steps.check.outputs.behind != '0'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: sync-upstream-${{ github.run_id }}
          title: "Sync upstream (${{ steps.check.outputs.behind }} commits)"
          body: |
            Automated upstream sync from mpv-android/mpv-android.

            **${{ steps.check.outputs.behind }}** new commits to merge.

            Check for conflicts in files listed in FORK.md change registry.
          base: master
          labels: upstream-sync
