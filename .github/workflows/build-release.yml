name: Build Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDefaultRelease assembleBridgeRelease || echo "Build requires native libs — see buildscripts/README.md"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mpv-tv-apks
          path: |
            app/build/outputs/apk/default/release/*.apk
            bridge/build/outputs/apk/release/*.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/default/release/*.apk
            bridge/build/outputs/apk/release/*.apk
          generate_release_notes: true
