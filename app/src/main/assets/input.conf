# mpv-tv default keybindings for Android TV remote

# Seeking (D-pad)
RIGHT seek 10
LEFT seek -10
FORWARD no-osd seek 30
REWIND no-osd seek -30

# Audio delay
1 add audio-delay +0.1
4 add audio-delay -0.1
7 set audio-delay 0; show-text "Audio delay: 0ms" 2000

# Zoom / Pan / Aspect
0 set video-zoom 0; no-osd set panscan 0; no-osd set video-pan-x 0; no-osd set video-pan-y 0; no-osd set video-align-x 0; no-osd set video-align-y 0; show-text "Zoom/Pan reset" 1500
3 cycle-values video-aspect-override 16:9 4:3 2.35:1 no; show-text "Aspect: ${video-aspect-override}" 2000
2 add panscan 0.01
5 add panscan -0.01
8 set panscan 0.42; show-text "Panscan: 0.42" 1500

# Screenshot
6 screenshot; show-text "Screenshot saved" 2000

# Info display
BS show-text "${media-title}\n${width}x${height} ${video-codec}\n${audio-codec-name} ${audio-params/channel-count}ch\nPos: ${playback-time} / ${duration}" 5000

# Multimedia keys
PLAYPAUSE cycle pause
PLAY set pause no
PAUSE set pause yes
