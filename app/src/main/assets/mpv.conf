# mpv-tv default configuration for Android TV
# User config in external files dir overrides this on first run

# Video
vo=gpu
gpu-context=android
hwdec=mediacodec
dither-depth=auto

# Audio
audio-spdif=ac3,dts
volume-max=100
volume=100

# Buffering (for network streams)
demuxer-max-bytes=150MiB
demuxer-readahead-secs=120

# OSD
osd-font-size=40
osd-duration=2000

# Screenshots
screenshot-format=jpg
screenshot-jpeg-quality=95

# Playback
save-position-on-quit=yes

# mpv-tv custom options (mpvtv-* prefix, parsed by the app)
# mpvtv-seekbar=yes
