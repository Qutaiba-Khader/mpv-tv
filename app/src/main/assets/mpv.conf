# mpv-tv default configuration for Android TV
# User config in external files dir overrides this on first run

# Video
vo=gpu
gpu-context=android
hwdec=mediacodec
dither-depth=auto

# Audio
audio-spdif=ac3,dts
volume-max=100
volume=100

# Buffering (for network streams)
demuxer-max-bytes=150MiB
demuxer-readahead-secs=120

# OSD
osd-font-size=40
osd-duration=2000

# Screenshots
screenshot-format=jpg
screenshot-jpeg-quality=95

# Playback
save-position-on-quit=yes

# === Profiles (activatable via intent extra: profile=<name>) ===

# Low-latency live streaming (TikTok, RTMP, HLS live)
# Activate: intent extra profile=low-latency (built-in mpv profile)
# Or auto-activate with the conditional profile below

# Auto-detect MediaFlow-proxied live streams
[lowlatency-live]
profile-cond=path and (path:find("mediaflowproxy") or path:find(".flv") or path:find("live"))
profile=low-latency
profile-restore=copy-equal

# VOD with large buffer (for network VOD with seeking)
[vod-buffered]
profile-cond=false
demuxer-max-bytes=256MiB
demuxer-readahead-secs=300
cache=yes
profile-restore=copy-equal

# No resume (for content that shouldn't save position)
[no-resume]
profile-cond=false
save-position-on-quit=no
resume-playback=no
profile-restore=copy-equal

